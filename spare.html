<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spare parts - Moti DD ERP</title>
  <link rel="icon" href="img/logo-small.jpg">
  <meta name="theme-color" content="#3a68a3">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>
  <main>
    <div id="roNote"></div>

    <div class="card" id="formCard">
      <h2 id="formTitle"></h2>
      <div class="grid" id="fields"></div>
      <p>
        <button id="saveBtn"></button>
        <button id="cancelBtn" class="secondary" hidden></button>
      </p>
      <div id="msg" class="msg"></div>
    </div>

    <div class="card" id="reportCard" hidden>
      <h2 data-t="spareReport"></h2>
      <div class="grid">
        <div><label for="rFrom" data-t="fromDate"></label><input id="rFrom" type="date"></div>
        <div><label for="rTo" data-t="toDate"></label><input id="rTo" type="date"></div>
      </div>
      <p><button id="rXls" class="secondary" data-t="download"></button></p>
    </div>

    <div class="card">
      <h2 data-t="spare"></h2>
      <div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-round1.js"></script>
  <script src="js/common.js"></script>
  <script src="js/timer.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const TZ = "Africa/Addis_Ababa";
    const dayOf = ts => new Date(ts).toLocaleDateString("en-CA", { timeZone: TZ });
    const addDays = (s, n) => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    const nowLocal = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);   // for the date-time box
    const when = ts => new Date(ts).toLocaleString(getLang() === "am" ? "am-ET" : "en-GB");
    // [column, label key, input type, required?]
    const FIELDS = [
      ["bank", "bank", "text", true], ["branch", "branch", "text", true],
      ["item_type", "itemType", "text", true], ["quantity", "quantity", "number"],
      ["requested_at", "requestedAt", "datetime-local"],
    ];
    let ME, MGR, ADMIN, VIEW, rows = [], engineers = [], editingId = null;

    const msg = (text, ok) => { $("msg").textContent = text || ""; $("msg").className = "msg" + (ok ? " ok" : ""); };

    (async () => {
      const auth = await requireLogin();
      if (!auth) return;
      ME = auth.profile; MGR = isManager(ME); ADMIN = ME.role === "admin"; VIEW = canView(ME);
      renderHeader(ME);
      if (ADMIN) { $("formCard").hidden = true; $("roNote").innerHTML = `<div class="ro-note">${t("viewOnly")}</div>`; }
      else {
        const { data: eng } = await db.rpc("list_engineers");
        engineers = (eng || []).filter(e => e.id !== ME.id);
        $("fields").innerHTML = `<div><label for="f_recipient_id">${t("askedPerson")}</label><select id="f_recipient_id">
          <option value="">${t("selectOne")}</option>${engineers.map(e => `<option value="${e.id}">${esc(e.full_name)}</option>`).join("")}</select></div>` +
          FIELDS.map(([k, l, type]) => `<div><label for="f_${k}">${t(l)}</label><input id="f_${k}" type="${type}" ${type === "number" ? 'min="1" step="1" inputmode="numeric"' : ""}></div>`).join("");
        resetForm();
      }
      if (VIEW) { $("reportCard").hidden = false; $("rTo").value = dayOf(new Date()); $("rFrom").value = addDays($("rTo").value, -29); }
      translatePage();
      load();
    })();

    function resetForm() {
      editingId = null;
      $("f_recipient_id").value = "";
      FIELDS.forEach(([k]) => ($("f_" + k).value = ""));
      $("f_quantity").value = 1;
      $("f_requested_at").value = nowLocal();     // date and time are filled automatically; the person can change them
      $("formTitle").textContent = t("newSpare");
      $("saveBtn").textContent = t("save");
      $("cancelBtn").textContent = t("cancel");
      $("cancelBtn").hidden = true;
    }

    async function load() {
      const { data, error } = await db.from("spare_requests").select("*").order("serial_no", { ascending: false });
      if (error) return msg(t("error") + " " + error.message);
      rows = data; render();
    }

    function render() {
      const cols = ["#", "requestedAt", "requester", "askedPerson", "bank", "branch", "itemType", "quantity", "status"].concat(ADMIN ? [] : ["actions"]);
      $("thead").innerHTML = "<tr>" + cols.map(c => `<th>${c === "#" ? "#" : t(c)}</th>`).join("") + "</tr>";
      $("tbody").innerHTML = rows.length ? rows.map(r => {
        const b = [];
        // The asked person answers yes / no while the request is pending
        if (r.status === "pending" && r.recipient_id === ME.id) {
          b.push(`<button data-act="yes" data-id="${r.id}">${t("accept")}</button>`, `<button class="secondary" data-act="no" data-id="${r.id}">${t("reject")}</button>`);
        }
        if (MGR) b.push(`<button class="secondary" data-act="edit" data-id="${r.id}">${t("edit")}</button>`, `<button class="secondary" data-act="del" data-id="${r.id}">${t("del")}</button>`);
        const timer = r.status === "pending" ? pendingBadge(r.requested_at) : "";   // counts from the time it was requested
        return `<tr><td>${r.serial_no}</td><td>${esc(when(r.requested_at))}</td><td>${personLink(r.requester_id, r.requester_name)}</td><td>${personLink(r.recipient_id, r.recipient_name)}</td>
          <td>${esc(r.bank)}</td><td>${esc(r.branch)}</td><td>${esc(r.item_type)}</td><td>${r.quantity}</td>
          <td><span class="badge ${r.status}">${t("sp_" + r.status)}</span>${timer}${r.response_note ? `<br><small>${esc(r.response_note)}</small>` : ""}</td>
          ${ADMIN ? "" : `<td>${b.join(" ")}</td>`}</tr>`;
      }).join("") : `<tr><td colspan="${cols.length}">${t("noData")}</td></tr>`;
    }

    // ---------- Save (new request, or manager edit) ----------
    $("saveBtn").onclick = async () => {
      msg("");
      const v = {};
      for (const [k, , type, req] of FIELDS) {
        const val = $("f_" + k).value.trim();
        if (req && !val) return msg(t("fillRequired"));
        v[k] = type === "number" ? Math.max(1, Number(val || 1)) : val;
      }
      const rid = $("f_recipient_id").value;
      if (!rid) return msg(t("fillRequired"));
      const at = v.requested_at ? new Date(v.requested_at).toISOString() : new Date().toISOString();
      let error;
      if (editingId) {
        ({ error } = await db.from("spare_requests").update({
          recipient_id: rid, recipient_name: engineers.find(e => e.id === rid)?.full_name || null,
          bank: v.bank, branch: v.branch, item_type: v.item_type, quantity: v.quantity, requested_at: at,
        }).eq("id", editingId));
      } else {
        ({ error } = await db.rpc("create_spare_request", { p_to: rid, p_bank: v.bank, p_branch: v.branch, p_item: v.item_type, p_qty: v.quantity, p_at: at }));
      }
      if (error) return msg(t("error") + " " + error.message);
      resetForm(); msg(t("saved"), true); load();
    };
    $("cancelBtn").onclick = resetForm;

    // ---------- Row buttons ----------
    $("tbody").onclick = async (e) => {
      const b = e.target.closest("button[data-act]");
      if (!b) return;
      const id = b.dataset.id, row = rows.find(r => r.id === id);
      if (b.dataset.act === "yes" || b.dataset.act === "no") {
        const accept = b.dataset.act === "yes";
        const note = accept ? "" : (prompt(t("rejectNote")) || "");
        const { error } = await db.rpc("respond_spare_request", { p_id: id, p_accept: accept, p_note: note });
        if (error) alert(error.message);
        load(); refreshBell();
      } else if (b.dataset.act === "edit") {
        editingId = id;
        if (!engineers.some(x => x.id === row.recipient_id)) engineers.push({ id: row.recipient_id, full_name: row.recipient_name });
        $("f_recipient_id").innerHTML = `<option value="">${t("selectOne")}</option>` + engineers.map(x => `<option value="${x.id}">${esc(x.full_name)}</option>`).join("");
        $("f_recipient_id").value = row.recipient_id;
        FIELDS.forEach(([k]) => ($("f_" + k).value = row[k] ?? ""));
        $("f_requested_at").value = new Date(new Date(row.requested_at).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        $("formTitle").textContent = t("editSpare");
        $("saveBtn").textContent = t("update");
        $("cancelBtn").hidden = false;
        window.scrollTo(0, 0);
      } else if (b.dataset.act === "del" && confirm(t("confirmDelete"))) {
        await db.from("spare_requests").delete().eq("id", id);
        load();
      }
    };

    // ---------- Excel report (manager / admin) ----------
    function group(R, keyFn, valFn) { const o = {}; R.forEach(r => { const k = keyFn(r) || "-"; o[k] = (o[k] || 0) + valFn(r); }); return o; }
    $("rXls").onclick = () => {
      const R = rows.filter(r => { const d = dayOf(r.requested_at); return d >= $("rFrom").value && d <= $("rTo").value; });
      const sum = [
        { [t("sheetSummary")]: t("totalRequests"), [t("count")]: R.length },
        { [t("sheetSummary")]: t("totalQty"), [t("count")]: R.reduce((s, r) => s + Number(r.quantity), 0) },
        { [t("sheetSummary")]: t("sp_approved"), [t("count")]: R.filter(r => r.status === "approved").length },
        { [t("sheetSummary")]: t("sp_rejected"), [t("count")]: R.filter(r => r.status === "rejected").length },
        { [t("sheetSummary")]: t("sp_pending"), [t("count")]: R.filter(r => r.status === "pending").length },
      ];
      const tableOf = (keyFn, label) => {
        const n = group(R, keyFn, () => 1), q = group(R, keyFn, r => Number(r.quantity));
        return Object.keys(n).map(k => ({ [label]: k, [t("count")]: n[k], [t("quantity")]: q[k] }));
      };
      const bankBranch = R => {
        const n = group(R, r => r.bank + " / " + r.branch, () => 1), q = group(R, r => r.bank + " / " + r.branch, r => Number(r.quantity));
        return Object.keys(n).map(k => ({ [t("bank") + " / " + t("branch")]: k, [t("count")]: n[k], [t("quantity")]: q[k] }));
      };
      const details = R.map(r => ({
        "#": r.serial_no, [t("requestedAt")]: new Date(r.requested_at).toLocaleString("en-GB", { timeZone: TZ }),
        [t("requester")]: r.requester_name, [t("askedPerson")]: r.recipient_name, [t("bank")]: r.bank, [t("branch")]: r.branch,
        [t("itemType")]: r.item_type, [t("quantity")]: r.quantity, [t("status")]: t("sp_" + r.status),
        [t("answeredAt")]: r.responded_at ? new Date(r.responded_at).toLocaleString("en-GB", { timeZone: TZ }) : "", [t("reason")]: r.response_note || "",
      }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sum), t("sheetSummary"));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tableOf(r => r.requester_name, t("requester"))), t("requester"));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bankBranch(R)), "Bank-Branch");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tableOf(r => r.item_type, t("itemType"))), t("sheetByItem"));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(details), t("sheetDetails"));
      XLSX.writeFile(wb, `spare-requests-${$("rFrom").value}_${$("rTo").value}.xlsx`);
    };
  </script>
</body>
</html>
